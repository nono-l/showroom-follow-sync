<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>フォローオンライブ同期</title>
  <style>
    body { font: 13px/1.5 sans-serif; width: 300px; margin: 12px; color: #222; }
    .title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; gap: 8px; }
    h1 { font-size: 14px; margin: 0; }
    #version { font-size: 11px; color: #888; white-space: nowrap; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    input[type="number"], input[type="text"] { width: 72px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 8px; }
    button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; }
    #status { margin-top: 8px; color: #555; font-size: 12px; white-space: pre-wrap; }
    .hint { color: #666; font-size: 11px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="title"><h1>フォロー中オンライブ同期</h1><span id="version"></span></div>
  <label><input type="checkbox" id="enabled"> 自動同期する</label>
  <label><input type="checkbox" id="openEnabled"> 未オープンの配信を開く</label>
  <label><input type="checkbox" id="closeEnabled"> 終了ルームを閉じる</label>
  <label><input type="checkbox" id="rotateEnabled"> 配信タブを公平に巡回する</label>
  <label><input type="checkbox" id="dedicatedWindow"> 配信を専用ウィンドウに集める</label>
  <div class="row"><span>1ルームあたり（秒）</span><input type="number" id="viewSec" min="1" step="1"></div>
  <div class="row"><span>再取得の下限（秒）</span><input type="number" id="minCycleSec" min="5" step="5"></div>
  <div class="row"><span>同時オープン上限</span><input type="number" id="maxOpen" min="1" max="50"></div>
  <div class="row"><span>genre_id（空なら指定なし）</span><input type="text" id="genreId"></div>
  <p class="hint">次の取得は max(巡回タブ数×見る秒, 下限秒) のあとです。上限いっぱいなら視聴時間が長い部屋を一時無視し、同時配信が減ったら1件ずつ戻します。</p>
  <button id="run">今すぐ同期して巡回開始</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
